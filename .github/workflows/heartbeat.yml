# ──────────────────────────────────────────────────────────────────────────────
# Heartbeat Orchestrator
#
# Triggers:  workflow_dispatch (manual fallback only)
#
# What it does when manually triggered:
#   1. Evaluates every open PR for readiness.
#   2. Converts eligible drafts to ready-for-review.
#   3. Merges / enables auto-merge for mergeable PRs.
#   4. Posts @copilot conflict/fix handoffs for blocked PRs.
#   5. Dispatches backlog-routing agent workflows (task-assignment, pm, po).
# ──────────────────────────────────────────────────────────────────────────────
name: Heartbeat Orchestrator

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no mutations)'
        type: boolean
        default: false
      once:
        description: 'Run a single heartbeat and exit'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  pull-requests: write
  discussions: write
  actions: write
  copilot-requests: write

jobs:
  heartbeat:
    name: Heartbeat Orchestrator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure GitHub Copilot CLI
        run: |
          if ! gh copilot -- --version >/dev/null 2>&1; then
            npm install --global @github/copilot
          fi
          gh copilot -- --version

      - name: Run heartbeat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          # Set GH_USER_PAT (actions:write) to allow workflow dispatch from the heartbeat.
          HEARTBEAT_GH_TOKEN: ${{ secrets.GH_USER_PAT }}
        run: |
          DRY_RUN="${{ inputs.dry_run || 'false' }}"
          if [[ "$DRY_RUN" != "true" && -z "${HEARTBEAT_GH_TOKEN:-}" ]]; then
            echo "::warning::GH_USER_PAT is not configured; forcing --dry-run. Local scripts/autonomous-heartbeat.sh is the primary runtime."
            DRY_RUN="true"
          fi
          EXTRA_FLAGS=""
          if [[ "$DRY_RUN" == "true" ]]; then
            EXTRA_FLAGS="--dry-run"
          fi
          python3 scripts/heartbeat_runner.py --once $EXTRA_FLAGS
