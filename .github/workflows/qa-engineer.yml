# ──────────────────────────────────────────────────────────────────────────────
# QA Engineer Agent — Quinn
#
# Triggers:  pull_request (opened / synchronize / reopened)
#            issues labeled "needs-qa"
#            schedule (continuous autonomous review)
#            workflow_dispatch
#            workflow_call (from council-discussion or agent-router)
#
# Skills:    code-review · issue-creation · pr-feedback · security-scan
#
# Reads persona from .github/agents.md (QA Engineer section).
# Model defaults to gpt-5.3-codex; override with repository variable QA_MODEL.
# ──────────────────────────────────────────────────────────────────────────────
name: QA Engineer Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issues:
    types: [labeled]
  schedule:
    # Keep Quinn continuously active even when no fresh PR event fires.
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review (leave blank for latest)'
        required: false
      extra_context:
        description: 'Additional context for the QA review'
        required: false
  workflow_call:
    inputs:
      pr_number:
        type: string
        description: 'PR number to review'
        required: false
      extra_context:
        type: string
        description: 'Additional context'
        required: false
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: false

permissions:
  contents: read
  issues: write
  copilot-requests: write
  pull-requests: write

env:
  QA_MODEL: ${{ vars.QA_MODEL || 'gpt-5.3-codex' }}
  AGENT_MAX_TOKENS: ${{ vars.AGENT_MAX_TOKENS || '2048' }}
  AGENT_TEMPERATURE: ${{ vars.AGENT_TEMPERATURE || '0.7' }}
  QA_SEVERITY_THRESHOLD: ${{ vars.QA_SEVERITY_THRESHOLD || 'HIGH' }}
  QA_AUTONOMOUS_ENABLED: ${{ vars.QA_AUTONOMOUS_ENABLED || 'true' }}
  QA_COLLAB_REPOSITORIES: ${{ vars.QA_COLLAB_REPOSITORIES || '' }}
  QA_AGENT_SKILLS: ${{ vars.QA_AGENT_SKILLS || 'code-review,issue-creation,pr-feedback,security-scan' }}

jobs:
  qa-review:
    name: Quinn · QA Engineer Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run on PRs, manual dispatch, workflow_call, or issues labeled "needs-qa"
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' ||
      (github.event_name == 'schedule' && vars.QA_AUTONOMOUS_ENABLED != 'false') ||
      (github.event_name == 'issues' &&
       contains(github.event.issue.labels.*.name, 'needs-qa'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history needed only for pull_request events (git diff against base).
          # Non-PR triggers (workflow_dispatch, workflow_call, issues) don't use git
          # diff and benefit from the faster shallow clone.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      # ── Gather context ───────────────────────────────────────────────────
      - name: Gather PR context
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QA_COLLAB_REPOSITORIES: ${{ env.QA_COLLAB_REPOSITORIES }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            PR_TITLE="${{ github.event.pull_request.title }}"
            PR_AUTHOR="${{ github.event.pull_request.user.login }}"
            BASE_REF="${{ github.base_ref }}"

            # Diff stats and content (truncated to stay within token limits)
            DIFF_STAT=$(git diff "origin/$BASE_REF"...HEAD --stat 2>/dev/null | head -80 || echo "N/A")
            FILES=$(git diff --name-only "origin/$BASE_REF"...HEAD 2>/dev/null | head -50 || echo "N/A")
            DIFF_CONTENT=$(git diff "origin/$BASE_REF"...HEAD 2>/dev/null | head -150 || echo "N/A")
            PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body' 2>/dev/null || echo "")

          elif [ -n "${{ inputs.pr_number }}" ]; then
            PR_NUMBER="${{ inputs.pr_number }}"
            PR_INFO=$(gh pr view "$PR_NUMBER" --json title,author,body 2>/dev/null || echo '{}')
            PR_TITLE=$(echo "$PR_INFO" | python3 -c "import json,sys; print(json.load(sys.stdin).get('title',''))" 2>/dev/null || echo "PR #$PR_NUMBER")
            PR_AUTHOR=$(echo "$PR_INFO" | python3 -c "import json,sys; print(json.load(sys.stdin).get('author',{}).get('login',''))" 2>/dev/null || echo "")
            PR_BODY=$(echo "$PR_INFO" | python3 -c "import json,sys; print(json.load(sys.stdin).get('body',''))" 2>/dev/null || echo "")
            DIFF_STAT=$(gh pr diff "$PR_NUMBER" --stat 2>/dev/null | head -80 || echo "N/A")
            FILES=$(gh pr diff "$PR_NUMBER" --name-only 2>/dev/null | head -50 || echo "N/A")
            DIFF_CONTENT=$(gh pr diff "$PR_NUMBER" 2>/dev/null | head -150 || echo "N/A")

          else
            # Autonomous/manual fallback: pick the highest-priority open PR.
            PR_NUMBER=$(gh pr list \
              --state open \
              --limit 1 \
              --json number \
              --jq '.[0].number' 2>/dev/null || echo "")

            if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
              PR_INFO=$(gh pr view "$PR_NUMBER" --json title,author,body 2>/dev/null || echo '{}')
              PR_TITLE=$(echo "$PR_INFO" | python3 -c "import json,sys; print(json.load(sys.stdin).get('title',''))" 2>/dev/null || echo "PR #$PR_NUMBER")
              PR_AUTHOR=$(echo "$PR_INFO" | python3 -c "import json,sys; print(json.load(sys.stdin).get('author',{}).get('login',''))" 2>/dev/null || echo "")
              PR_BODY=$(echo "$PR_INFO" | python3 -c "import json,sys; print(json.load(sys.stdin).get('body',''))" 2>/dev/null || echo "")
              DIFF_STAT=$(gh pr diff "$PR_NUMBER" --stat 2>/dev/null | head -80 || echo "N/A")
              FILES=$(gh pr diff "$PR_NUMBER" --name-only 2>/dev/null | head -50 || echo "N/A")
              DIFF_CONTENT=$(gh pr diff "$PR_NUMBER" 2>/dev/null | head -150 || echo "N/A")
            else
              PR_NUMBER="N/A"
              PR_TITLE="Autonomous QA Review (no open PRs found)"
              PR_AUTHOR=""
              PR_BODY="${{ inputs.extra_context }}"
              DIFF_STAT="N/A"
              FILES="N/A"
              DIFF_CONTENT="N/A"
            fi
          fi

          CROSS_REPO_CONTEXT="No cross-repository issue sources configured."
          VALID_COLLAB_REPOS=""
          if [ -n "$QA_COLLAB_REPOSITORIES" ]; then
            CROSS_REPO_CONTEXT=""
            REPO_COUNT=0
            IFS=',' read -ra RAW_REPOS <<< "$QA_COLLAB_REPOSITORIES"
            for RAW_REPO in "${RAW_REPOS[@]}"; do
              TARGET_REPO=$(echo "$RAW_REPO" | xargs)
              [ -z "$TARGET_REPO" ] && continue
              [[ "$TARGET_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_-]+$ ]] || continue
              [ "$TARGET_REPO" = "${{ github.repository }}" ] && continue
              REPO_COUNT=$((REPO_COUNT + 1))
              # Cap cross-repo queries to keep latency and prompt size bounded.
              [ "$REPO_COUNT" -gt 3 ] && break
              if [ -n "$VALID_COLLAB_REPOS" ]; then
                VALID_COLLAB_REPOS="${VALID_COLLAB_REPOS},${TARGET_REPO}"
              else
                VALID_COLLAB_REPOS="${TARGET_REPO}"
              fi

              OPEN_ISSUES_OUTPUT=$(gh issue list \
                --repo "$TARGET_REPO" \
                --state open \
                --limit 5 \
                --json number,title,url \
                --jq '.[] | "- #\(.number) \(.title) (\(.url))"' 2>&1)
              OPEN_ISSUES_STATUS=$?

              if [ "$OPEN_ISSUES_STATUS" -eq 0 ]; then
                if [ -z "$OPEN_ISSUES_OUTPUT" ]; then
                  OPEN_ISSUES="- No open issues found."
                else
                  OPEN_ISSUES="$OPEN_ISSUES_OUTPUT"
                fi
              else
                OPEN_ISSUES_ERROR=$(echo "$OPEN_ISSUES_OUTPUT" | head -1)
                OPEN_ISSUES="- Unable to access open issues: $OPEN_ISSUES_ERROR"
              fi

              CROSS_REPO_CONTEXT="${CROSS_REPO_CONTEXT}
              Repository: ${TARGET_REPO}
              ${OPEN_ISSUES}
              "
            done

            if [ -z "$CROSS_REPO_CONTEXT" ]; then
              CROSS_REPO_CONTEXT="No valid repositories provided in QA_COLLAB_REPOSITORIES."
            fi
          fi

          {
            echo "pr_number=$PR_NUMBER"
            echo "pr_title=$PR_TITLE"
            echo "pr_author=$PR_AUTHOR"
            echo "collab_repos=$VALID_COLLAB_REPOS"
            echo "context<<QA_CTX_EOF"
            echo "## PR Information"
            echo "- Number: $PR_NUMBER"
            echo "- Title: $PR_TITLE"
            echo "- Author: $PR_AUTHOR"
            echo "- Description: $PR_BODY"
            echo ""
            echo "## Changed Files"
            echo "$FILES"
            echo ""
            echo "## Diff Statistics"
            echo "$DIFF_STAT"
            echo ""
            echo "## Diff Content (truncated)"
            echo "$DIFF_CONTENT"
            echo ""
            echo "## Additional Context"
            echo "${{ inputs.extra_context }}"
            echo ""
            echo "## Cross-Repository Issue Context"
            echo "$CROSS_REPO_CONTEXT"
            echo "QA_CTX_EOF"
          } >> "$GITHUB_OUTPUT"

      # ── Call Copilot model ──────────────────────────────────────────────
      - name: Quinn — QA Engineer analysis
        id: qa
        uses: ./.github/actions/call-copilot-model
        with:
          model: ${{ env.QA_MODEL }}
          max-tokens: ${{ env.AGENT_MAX_TOKENS }}
          temperature: ${{ env.AGENT_TEMPERATURE }}
          token: ${{ secrets.COPILOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          fallback-token: ${{ secrets.GITHUB_TOKEN }}
          system-prompt: |
            You are Quinn, a senior QA Engineer with 10+ years of experience in
            software quality assurance, security review, and test strategy.

            Your role on this engineering team:
            - Review code changes thoroughly for bugs, security issues, and
              quality concerns
            - Identify missing test coverage and suggest specific test cases
            - Assess risk and provide an approval recommendation
            - Be constructive, specific, and actionable — never vague

            Configured skill set for this run (repository variable QA_AGENT_SKILLS):
            ${{ env.QA_AGENT_SKILLS }}
            Keep your analysis aligned to these configured skills.

            Always format your response EXACTLY as follows:

            ## QA Review — PR #<number>

            **Risk Level**: [LOW | MEDIUM | HIGH | CRITICAL]
            **Recommendation**: [✅ APPROVE | 🔄 REQUEST CHANGES | 🚫 BLOCK]

            ### Summary
            Two to three sentences summarising the quality profile of these changes.

            ### Issues Found
            For each issue use this format:
            - **[SEVERITY]** `file:line` — Description and why it matters
              - 💡 Fix: concrete recommendation

            If no issues found, write "No issues found."

            ### Security Assessment
            Evaluate for ALL of the OWASP Top 10 categories relevant to these
            changes and explicitly note findings or "Not applicable" for each:
            - **A01 Broken Access Control**: missing authorisation checks, IDOR,
              path traversal, privilege escalation
            - **A02 Cryptographic Failures**: weak/absent encryption, hardcoded
              secrets, plaintext sensitive data, insecure hash algorithms (MD5/SHA1)
            - **A03 Injection**: SQL, command, LDAP, XSS, template injection; any
              unsanitised user input flowing into interpreters
            - **A04 Insecure Design**: missing threat modelling, unsafe default
              configs, lack of rate limiting or input validation
            - **A05 Security Misconfiguration**: overly permissive CORS/CSP, debug
              modes enabled, verbose error messages leaking internals
            - **A06 Vulnerable & Outdated Components**: pinned dependency versions
              with known CVEs, use of deprecated/unmaintained libraries
            - **A07 Identification & Authentication Failures**: weak session
              management, missing MFA paths, predictable tokens
            - **A08 Software & Data Integrity Failures**: unverified downloads,
              unsigned packages, unsafe deserialisation, insecure CI/CD pipelines
            - **A09 Security Logging & Monitoring Failures**: absent or insufficient
              audit logging, secrets appearing in log output
            - **A10 Server-Side Request Forgery (SSRF)**: user-controlled URLs
              passed to HTTP clients without validation
            Also check for: hardcoded credentials or API keys, insecure randomness,
            overly broad GitHub Actions permissions, `pull_request_target` workflows
            that run untrusted code, and third-party actions that are not pinned to
            immutable SHAs.
            State "No security concerns identified" if the changes are clean.

            ### Test Coverage Gaps
            List specific missing tests with their purpose. State "Coverage looks
            adequate" if nothing is missing.

            ### Notes for Author
            Any non-blocking suggestions or praise.
          user-prompt: |
            Please review the following pull request:

            ${{ steps.ctx.outputs.context }}

      # ── Validate model response ───────────────────────────────────────────
      - name: Validate model response
        id: qa_response
        env:
          QA_RESPONSE: ${{ steps.qa.outputs.response }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import sys
          import textwrap

          response = os.environ.get("QA_RESPONSE", "")
          pr_number = os.environ.get("PR_NUMBER", "N/A")

          if response.startswith("⚠️"):
              model_error = response
              print(
                  f"WARNING: Model call failed — {model_error}\n"
                  "Check that COPILOT_GITHUB_TOKEN is valid, the model identifier is correct,\n"
                  "and that Copilot CLI can access the configured model.\n"
                  "Falling back to a manual-review handoff so the workflow can still complete.",
                  file=sys.stderr,
              )
              response = textwrap.dedent(
                  f"""\
                  ## QA Review — PR #{pr_number}

                  **Risk Level**: [MEDIUM]
                  **Recommendation**: [🔄 REQUEST CHANGES]

                  ### Summary
                  Automated QA analysis could not be completed because the Copilot request failed.
                  Manual follow-up is required before this change is merged.

                  ### Issues Found
                  - **[MEDIUM]** `workflow` — Quinn could not complete the automated review because the Copilot request failed.
                    - 💡 Fix: verify `COPILOT_GITHUB_TOKEN` (or fallback `GITHUB_TOKEN`) can make Copilot requests, confirm the configured model identifier is valid, and rerun the workflow.

                  ### Security Assessment
                  Automated security analysis was unavailable because the model response failed. Review OWASP Top 10 areas manually before merging.

                  ### Test Coverage Gaps
                  Automated QA could not assess coverage. Confirm the changed behavior has focused tests before merging.

                  ### Notes for Author
                  Original model error: {model_error}"""
              )
          elif not response.strip():
              print(
                  "WARNING: Empty response received from model.\n"
                  "The API call may have timed out or the response was truncated.\n"
                  "Consider reducing AGENT_MAX_TOKENS or the size of the diff context.\n"
                  "Falling back to a manual-review handoff so the workflow can still complete.",
                  file=sys.stderr,
              )
              response = textwrap.dedent(
                  f"""\
                  ## QA Review — PR #{pr_number}

                  **Risk Level**: [MEDIUM]
                  **Recommendation**: [🔄 REQUEST CHANGES]

                  ### Summary
                  Automated QA analysis returned an empty response, so Quinn could not complete the review.
                  Manual follow-up is required before this change is merged.

                  ### Issues Found
                  - **[MEDIUM]** `workflow` — Quinn returned an empty review payload for this change set.
                    - 💡 Fix: reduce `AGENT_MAX_TOKENS` or the diff context size if needed, then rerun the workflow.

                  ### Security Assessment
                  Automated security analysis was unavailable because the model response was empty. Review OWASP Top 10 areas manually before merging.

                  ### Test Coverage Gaps
                  Automated QA could not assess coverage. Confirm the changed behavior has focused tests before merging.

                  ### Notes for Author
                  Copilot CLI returned an empty response for this request."""
              )

          print("response<<QA_RESP_EOF")
          print(response)
          print("QA_RESP_EOF")
          PY

      # ── Post PR comment ──────────────────────────────────────────────────
      - name: Post review comment on PR
        if: steps.ctx.outputs.pr_number != 'N/A'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QA_RESPONSE: ${{ steps.qa_response.outputs.response }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
        run: |
          COMMENT="@copilot

          $QA_RESPONSE"

          if python3 - <<'PY'
          import os
          import re
          import sys

          response = os.environ.get("QA_RESPONSE", "")
          match = re.search(r"^\s*\*\*Recommendation\*\*:\s*\[(.*?)\]\s*$", response, re.MULTILINE)
          if not match:
              print(
                  'Warning: Could not find QA recommendation line matching pattern "**Recommendation**: [ACTION]"; skipping Copilot handoff.',
                  file=sys.stderr,
              )
              sys.exit(1)

          recommendation = match.group(1).upper()
          if "REQUEST CHANGES" in recommendation or "BLOCK" in recommendation:
              sys.exit(0)

          sys.exit(1)
          PY
          then
            COMMENT="$COMMENT

            Please address the QA findings above and push the required fixes to this PR."
          fi

          COMMENT="$COMMENT

          ---
          *🤖 Automated review by Quinn (QA Engineer Agent) · [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*"

          gh pr comment "$PR_NUMBER" --body "$COMMENT" || {
            echo "Warning: Failed to post PR comment for PR #$PR_NUMBER — check permissions and PR state." >&2
          }

      # ── Open issue for HIGH/CRITICAL findings ───────────────────────────
      - name: Open issue for serious findings
        # Non-critical step — a failure to create the tracking issue must not
        # block the overall QA workflow run.
        continue-on-error: true
        if: steps.ctx.outputs.pr_number != 'N/A'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QA_RESPONSE: ${{ steps.qa_response.outputs.response }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
          PR_TITLE: ${{ steps.ctx.outputs.pr_title }}
          QA_SEVERITY_THRESHOLD: ${{ env.QA_SEVERITY_THRESHOLD }}
          QA_COLLAB_REPOSITORIES: ${{ steps.ctx.outputs.collab_repos }}
        run: |
          if ! python3 - <<'PY'
          import os
          import re
          import sys

          response = os.environ.get("QA_RESPONSE", "")
          threshold = os.environ.get("QA_SEVERITY_THRESHOLD", "HIGH").strip().upper() or "HIGH"
          rank = {"LOW": 1, "MEDIUM": 2, "HIGH": 3, "CRITICAL": 4}

          if threshold not in rank:
              threshold = "HIGH"

          recommendation_match = re.search(
              r"^\s*\*\*Recommendation\*\*:\s*\[(.*?)\]\s*$",
              response,
              re.MULTILINE | re.IGNORECASE,
          )
          if recommendation_match:
              recommendation = recommendation_match.group(1).upper()
          else:
              recommendation_match = re.search(
                  r"^\s*\*\*Recommendation\*\*:\s*(.*?)\s*$",
                  response,
                  re.MULTILINE | re.IGNORECASE,
              )
              recommendation = recommendation_match.group(1).upper() if recommendation_match else ""

          if "REQUEST CHANGES" not in recommendation and "BLOCK" not in recommendation:
              print(
                  "Skipping QA tracking issue: recommendation does not request changes or block."
              )
              sys.exit(1)

          risk_match = re.search(
              r"^\s*\*\*Risk Level\*\*:\s*(?:\[(.*?)\]|(.*?))\s*$",
              response,
              re.MULTILINE | re.IGNORECASE,
          )
          risk_value = ((risk_match.group(1) or risk_match.group(2)) if risk_match else "").strip().upper()
          if risk_value not in rank:
              print(
                  "Skipping QA tracking issue: unable to determine risk level from QA response."
              )
              sys.exit(1)

          if rank[risk_value] < rank[threshold]:
              print(
                  f"Skipping QA tracking issue: risk level {risk_value} is below threshold {threshold}."
              )
              sys.exit(1)

          print(
              f"Proceeding with QA tracking issue: recommendation={recommendation}, risk={risk_value}, threshold={threshold}."
          )
          PY
          then
            exit 0
          fi

          ISSUE_BODY="## 🔍 QA Finding

          QA Engineer agent (Quinn) flagged serious issues in PR #$PR_NUMBER.

          **PR**: #$PR_NUMBER — $PR_TITLE
          **Workflow run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ---

          $QA_RESPONSE"

          # Try preferred labels first; retry without labels when unavailable.
          if ! gh issue create \
            --title "🐛 QA: Issues detected in PR #$PR_NUMBER — $PR_TITLE" \
            --body "$ISSUE_BODY" \
            --label "bug,qa-review" \
            2>/dev/null
          then
            if ! gh issue create \
              --title "🐛 QA: Issues detected in PR #$PR_NUMBER — $PR_TITLE" \
              --body "$ISSUE_BODY" \
              2>/dev/null
            then
              echo "Warning: Unable to create QA tracking issue in ${{ github.repository }}" >&2
            fi
          fi

          if [ -n "$QA_COLLAB_REPOSITORIES" ]; then
            IFS=',' read -ra RAW_REPOS <<< "$QA_COLLAB_REPOSITORIES"
            for RAW_REPO in "${RAW_REPOS[@]}"; do
              TARGET_REPO=$(echo "$RAW_REPO" | xargs)
              [ -z "$TARGET_REPO" ] && continue

              CROSS_REPO_BODY="$ISSUE_BODY

              ---
              Source repository: ${{ github.repository }}"

              # Target repositories may not have matching labels configured.
              if ! gh issue create \
                --repo "$TARGET_REPO" \
                --title "🐛 QA: Issues detected in PR #$PR_NUMBER — $PR_TITLE" \
                --body "$CROSS_REPO_BODY" \
                --label "bug,qa-review" \
                2>/dev/null
              then
                if ! gh issue create \
                  --repo "$TARGET_REPO" \
                  --title "🐛 QA: Issues detected in PR #$PR_NUMBER — $PR_TITLE" \
                  --body "$CROSS_REPO_BODY" \
                  2>/dev/null
                then
                  echo "Warning: Unable to mirror QA issue to $TARGET_REPO" >&2
                fi
              fi
            done
          fi

      # ── Post issue comment for needs-qa trigger ──────────────────────────
      - name: Post comment on needs-qa issue
        if: |
          github.event_name == 'issues' &&
          contains(github.event.issue.labels.*.name, 'needs-qa')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QA_RESPONSE: ${{ steps.qa_response.outputs.response }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          COMMENT="@copilot

          $QA_RESPONSE

          ---
          *🤖 Automated analysis by Quinn (QA Engineer Agent) · [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*"

          gh issue comment "$ISSUE_NUMBER" --body "$COMMENT" || {
            echo "Warning: Failed to post comment on needs-qa issue #$ISSUE_NUMBER — check permissions and issue state." >&2
          }
