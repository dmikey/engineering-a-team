name: Agent Personality Profiles

on:
  schedule:
    - cron: '0 10 * * 5'   # Every Friday at 10:00 UTC
  workflow_dispatch:
    inputs:
      action:
        description: 'set-profile, update-profile, suggest-pairing, or report'
        required: false
        default: 'report'
      agent_name:
        description: 'Agent name (for set-profile / update-profile actions)'
        required: false
      traits:
        description: 'Comma-separated personality traits (e.g. analytical, creative, decisive)'
        required: false
      strengths:
        description: 'Brief description of the agent's key strengths'
        required: false
      working_style:
        description: 'Short description of how the agent prefers to work'
        required: false

permissions:
  contents: read
  issues: write
  discussions: write

jobs:
  personality-profiles:
    runs-on: ubuntu-latest
    env:
      WORKFLOW_ACTION: ${{ inputs.action || 'report' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure personality-profile labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "personality-profile"        --color "e4e669" --force 2>/dev/null || true
          gh label create "personality-profile-update" --color "d4c5f9" --force 2>/dev/null || true

      - name: Create or update personality profile issue
        if: env.WORKFLOW_ACTION == 'set-profile'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_NAME: ${{ inputs.agent_name || '' }}
          TRAITS: ${{ inputs.traits || '' }}
          STRENGTHS: ${{ inputs.strengths || '' }}
          WORKING_STYLE: ${{ inputs.working_style || '' }}
        run: |
          if [ -z "$AGENT_NAME" ]; then
            echo "No agent name provided; skipping set-profile step."
            exit 0
          fi

          python3 - <<'PYEOF'
          import os, pathlib
          agent = os.environ["AGENT_NAME"]
          traits = os.environ.get("TRAITS", "")
          strengths = os.environ.get("STRENGTHS", "")
          working_style = os.environ.get("WORKING_STYLE", "")
          body = (
              "## Agent Personality Profile\n\n"
              f"**Agent**: {agent}\n"
              f"**Traits**: {traits}\n"
              f"**Strengths**: {strengths}\n"
              f"**Working Style**: {working_style}\n"
          )
          pathlib.Path("/tmp/profile-body.md").write_text(body, encoding="utf-8")
          pathlib.Path("/tmp/profile-title.txt").write_text(
              f"Agent Personality Profile: {agent}", encoding="utf-8"
          )
          PYEOF

          TITLE=$(cat /tmp/profile-title.txt)
          gh issue create \
            --title "$TITLE" \
            --body-file /tmp/profile-body.md \
            --label "personality-profile"

      - name: Record personality profile update
        if: env.WORKFLOW_ACTION == 'update-profile'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_NAME: ${{ inputs.agent_name || '' }}
          TRAITS: ${{ inputs.traits || '' }}
          STRENGTHS: ${{ inputs.strengths || '' }}
          WORKING_STYLE: ${{ inputs.working_style || '' }}
        run: |
          if [ -z "$AGENT_NAME" ]; then
            echo "No agent name provided; skipping update-profile step."
            exit 0
          fi

          DATE_UTC=$(date -u +"%Y-%m-%d")
          export DATE_UTC
          python3 - <<'PYEOF'
          import os, pathlib
          agent = os.environ["AGENT_NAME"]
          traits = os.environ.get("TRAITS", "")
          strengths = os.environ.get("STRENGTHS", "")
          working_style = os.environ.get("WORKING_STYLE", "")
          date_utc = os.environ.get("DATE_UTC", "")
          body = (
              f"## Profile Update — {date_utc}\n\n"
              f"**Agent**: {agent}\n"
              f"**Traits**: {traits}\n"
              f"**Strengths**: {strengths}\n"
              f"**Working Style**: {working_style}\n"
          )
          pathlib.Path("/tmp/update-body.md").write_text(body, encoding="utf-8")
          pathlib.Path("/tmp/update-title.txt").write_text(
              f"Agent Personality Profile Update: {agent}", encoding="utf-8"
          )
          PYEOF

          TITLE=$(cat /tmp/update-title.txt)
          gh issue create \
            --title "$TITLE" \
            --body-file /tmp/update-body.md \
            --label "personality-profile-update"

      - name: Collect profile issue data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list \
            --state all \
            --limit 500 \
            --json number,title,labels,body,createdAt \
            > /tmp/personality-issues.json

      - name: Generate pairings JSON
        if: env.WORKFLOW_ACTION == 'suggest-pairing' || env.WORKFLOW_ACTION == 'report' || github.event_name == 'schedule'
        run: |
          python3 .github/scripts/agent_personality_profiles.py \
            --input /tmp/personality-issues.json \
            --output-format pairings-json \
            > /tmp/personality-pairings.json

      - name: Post personality profiles report
        if: env.WORKFLOW_ACTION == 'report' || env.WORKFLOW_ACTION == 'suggest-pairing' || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DATE_UTC=$(date -u +"%Y-%m-%d")
          export CURRENT_DATE="$DATE_UTC"

          python3 .github/scripts/agent_personality_profiles.py \
            --input /tmp/personality-issues.json \
            > /tmp/personality-report.md

          REPORT=$(cat /tmp/personality-report.md)
          OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          REPO=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          TITLE="🧠 Agent Personality Profiles Report — $DATE_UTC"

          REPO_ID=$(gh api "repos/${{ github.repository }}" --jq '.node_id' 2>/dev/null || echo "")
          DISCUSSION_CREATED=false

          if [ -n "$REPO_ID" ]; then
            CATEGORY_ID=$(gh api graphql \
              -f query='query($o:String!,$r:String!){repository(owner:$o,name:$r){discussionCategories(first:20){nodes{id name}}}}' \
              -f o="$OWNER" -f r="$REPO" \
              --jq '.data.repository.discussionCategories.nodes[] | select(.name=="General") | .id' \
              2>/dev/null || echo "")

            if [ -z "$CATEGORY_ID" ]; then
              CATEGORY_ID=$(gh api graphql \
                -f query='query($o:String!,$r:String!){repository(owner:$o,name:$r){discussionCategories(first:1){nodes{id}}}}' \
                -f o="$OWNER" -f r="$REPO" \
                --jq '.data.repository.discussionCategories.nodes[0].id' \
                2>/dev/null || echo "")
            fi

            if [ -n "$CATEGORY_ID" ]; then
              DISCUSSION_URL=$(gh api graphql \
                -f query='mutation($ri:ID!,$ci:ID!,$t:String!,$b:String!){createDiscussion(input:{repositoryId:$ri,categoryId:$ci,title:$t,body:$b}){discussion{url}}}' \
                -f ri="$REPO_ID" -f ci="$CATEGORY_ID" -f t="$TITLE" -f b="$REPORT" \
                --jq '.data.createDiscussion.discussion.url' \
                2>/dev/null || echo "")

              if [ -n "$DISCUSSION_URL" ]; then
                echo "✅ Personality profiles report posted as Discussion: $DISCUSSION_URL"
                DISCUSSION_CREATED=true
              fi
            fi
          fi

          if [ "$DISCUSSION_CREATED" = "false" ]; then
            gh issue create --title "$TITLE" --body "$REPORT" --label "personality-profile"
            echo "✅ Personality profiles report posted as Issue (Discussion fallback)"
          fi
